<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NICo DPU Network Architecture — nico3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #f5f5f4;
    color: #1a1a1a;
    padding: 32px;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #52514e; margin-bottom: 28px; }
  .canvas {
    background: #ffffff;
    border: 1px solid #e0dfdb;
    border-radius: 12px;
    padding: 40px;
    max-width: 1100px;
    margin: 0 auto;
    overflow-x: auto;
  }
  svg text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

  /* VLAN zone colors */
  .zone-new    { fill: #e8f2fd; stroke: #2a78d6; }
  .zone-520    { fill: #fef3e0; stroke: #eda100; }
  .zone-bmc    { fill: #e8f8f0; stroke: #1baf7a; }

  /* Device boxes */
  .device {
    fill: #ffffff;
    stroke: #c8c7c1;
    stroke-width: 1.5;
    rx: 6;
  }
  .device-header {
    font-size: 11px;
    font-weight: 600;
    fill: #ffffff;
    text-anchor: middle;
  }
  .device-label {
    font-size: 11px;
    fill: #1a1a1a;
    text-anchor: middle;
  }
  .device-sublabel {
    font-size: 10px;
    fill: #52514e;
    text-anchor: middle;
  }
  .device-mac {
    font-size: 9px;
    fill: #7a7972;
    font-family: 'SF Mono', 'Fira Code', monospace;
    text-anchor: middle;
  }

  /* Service pills */
  .svc-pill {
    rx: 10;
    fill: #f0f4fa;
    stroke: #2a78d6;
    stroke-width: 1;
  }
  .svc-text {
    font-size: 9.5px;
    fill: #1a1a1a;
    text-anchor: middle;
    font-weight: 500;
  }
  .svc-port {
    font-size: 8.5px;
    fill: #52514e;
    text-anchor: middle;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }

  /* Connection lines */
  .conn-data   { stroke: #2a78d6; stroke-width: 2; fill: none; }
  .conn-mgmt   { stroke: #1baf7a; stroke-width: 1.5; fill: none; stroke-dasharray: 6 3; }
  .conn-trunk  { stroke: #2a78d6; stroke-width: 2.5; fill: none; }
  .conn-bridge { stroke: #e34948; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }

  /* Labels on connections */
  .conn-label {
    font-size: 9px;
    fill: #52514e;
    text-anchor: middle;
  }
  .conn-label-bg {
    fill: #ffffff;
    stroke: none;
  }

  /* Zone titles */
  .zone-title {
    font-size: 12px;
    font-weight: 600;
    text-anchor: start;
  }
  .zone-subtitle {
    font-size: 10px;
    text-anchor: start;
    fill: #52514e;
  }

  /* Status badges */
  .status-ok   { fill: #1baf7a; }
  .status-new  { fill: #2a78d6; }
  .status-text {
    font-size: 9px;
    fill: #ffffff;
    text-anchor: middle;
    font-weight: 600;
  }

  /* Legend */
  .legend-text {
    font-size: 10px;
    fill: #52514e;
  }
</style>
</head>
<body>
<h1>NICo DPU Onboarding — Network Architecture</h1>
<p class="subtitle">Cluster: nico3 (SNO) &nbsp;·&nbsp; Host: nvd-srv-06 &nbsp;·&nbsp; 2026-09-24</p>

<div class="canvas">
<svg viewBox="0 0 1020 620" xmlns="http://www.w3.org/2000/svg">

  <!-- ============================================================ -->
  <!-- ZONE: Dedicated VLAN (new) — top -->
  <!-- ============================================================ -->
  <rect x="20" y="20" width="980" height="230" rx="10"
        class="zone-new" stroke-width="2" stroke-dasharray="0" fill-opacity="0.4"/>
  <text x="40" y="46" class="zone-title" fill="#2a78d6">Dedicated VLAN (new)</text>
  <text x="40" y="60" class="zone-subtitle">NICo DHCP only — no lab DHCP</text>

  <!-- Status badge -->
  <rect x="900" y="30" width="80" height="20" rx="10" class="status-new"/>
  <text x="940" y="44" class="status-text">REQUESTED</text>

  <!-- DPU box -->
  <rect x="60" y="80" width="240" height="150" class="device"/>
  <rect x="60" y="80" width="240" height="26" rx="6" fill="#4a3aa7"/>
  <rect x="60" y="94" width="240" height="12" fill="#4a3aa7"/>
  <text x="180" y="98" class="device-header">BlueField-3 DPU</text>

  <text x="180" y="126" class="device-label">eth0 (100G data plane)</text>
  <text x="180" y="139" class="device-mac">02:de:1f:c2:c5:11</text>

  <line x1="80" y1="150" x2="280" y2="150" stroke="#e0dfdb" stroke-width="1"/>

  <text x="180" y="168" class="device-label">eth1 (100G data plane)</text>
  <text x="180" y="181" class="device-mac">02:31:dd:95:f6:18</text>

  <text x="180" y="220" class="device-sublabel">Access ports on dedicated VLAN</text>

  <!-- Host bridged through DPU -->
  <rect x="60" y="195" width="240" height="1" fill="none"/>
  <text x="180" y="207" class="device-mac" fill="#e34948">↑ Host PXE boots through DPU bridge</text>

  <!-- Arrow: DPU → VIP -->
  <line x1="300" y1="130" x2="520" y2="130" class="conn-data" marker-end="url(#arrow-blue)"/>
  <rect x="350" y="106" width="120" height="16" class="conn-label-bg" rx="3"/>
  <text x="410" y="117" class="conn-label">DHCP / PXE / DNS</text>

  <line x1="300" y1="170" x2="520" y2="170" class="conn-data" marker-end="url(#arrow-blue)"/>
  <rect x="358" y="156" width="104" height="16" class="conn-label-bg" rx="3"/>
  <text x="410" y="167" class="conn-label">API / SSH Console</text>

  <!-- MetalLB VIP box -->
  <rect x="520" y="76" width="220" height="168" class="device"/>
  <rect x="520" y="76" width="220" height="26" rx="6" fill="#2a78d6"/>
  <rect x="520" y="90" width="220" height="12" fill="#2a78d6"/>
  <text x="630" y="94" class="device-header">MetalLB VIP (shared)</text>
  <text x="630" y="115" class="device-sublabel">10.x.x.x (to be allocated)</text>

  <!-- Service pills -->
  <rect x="535" y="126" width="90" height="20" class="svc-pill" rx="10"/>
  <text x="580" y="140" class="svc-text">DHCP</text>
  <text x="580" y="151" class="svc-port">UDP 67</text>

  <rect x="635" y="126" width="90" height="20" class="svc-pill" rx="10"/>
  <text x="680" y="140" class="svc-text">PXE</text>
  <text x="680" y="151" class="svc-port">TCP 8080</text>

  <rect x="535" y="160" width="90" height="20" class="svc-pill" rx="10"/>
  <text x="580" y="174" class="svc-text">DNS</text>
  <text x="580" y="185" class="svc-port">UDP/TCP 53</text>

  <rect x="635" y="160" width="90" height="20" class="svc-pill" rx="10"/>
  <text x="680" y="174" class="svc-text">API</text>
  <text x="680" y="185" class="svc-port">TCP 443</text>

  <rect x="535" y="194" width="90" height="20" class="svc-pill" rx="10" fill="#fafafa" stroke="#c8c7c1"/>
  <text x="580" y="208" class="svc-text" fill="#7a7972">SSH</text>
  <text x="580" y="219" class="svc-port">TCP 22</text>

  <text x="680" y="212" class="device-sublabel" fill="#7a7972">(optional)</text>

  <!-- Arrow: VIP → OpenShift node (trunk) -->
  <line x1="740" y1="160" x2="800" y2="160" class="conn-trunk" marker-end="url(#arrow-blue)"/>

  <!-- OpenShift node box (spans both zones) -->
  <rect x="800" y="76" width="180" height="260" class="device" stroke="#2a78d6" stroke-width="2"/>
  <rect x="800" y="76" width="180" height="26" rx="6" fill="#eb6834"/>
  <rect x="800" y="90" width="180" height="12" fill="#eb6834"/>
  <text x="890" y="94" class="device-header">OpenShift Node (SNO)</text>

  <text x="890" y="120" class="device-label">ocp-qe-01</text>
  <text x="890" y="135" class="device-sublabel">10.6.141.100</text>

  <!-- Trunk indicator -->
  <rect x="812" y="150" width="156" height="40" rx="6" fill="#e8f2fd" stroke="#2a78d6" stroke-width="1"/>
  <text x="890" y="166" class="device-mac" fill="#2a78d6" style="font-weight:600;font-size:10px">Dedicated VLAN (tagged)</text>
  <text x="890" y="180" class="device-mac" fill="#2a78d6">eth0.XXX → MetalLB VIP</text>

  <rect x="812" y="196" width="156" height="40" rx="6" fill="#fef3e0" stroke="#eda100" stroke-width="1"/>
  <text x="890" y="212" class="device-mac" fill="#eda100" style="font-weight:600;font-size:10px">VLAN 520 (native/untagged)</text>
  <text x="890" y="226" class="device-mac" fill="#eda100">eth0 → 10.6.141.100</text>

  <text x="890" y="256" class="device-sublabel">Trunk port carries</text>
  <text x="890" y="268" class="device-sublabel">both VLANs</text>

  <!-- Redfish arrow down to BMC zone -->
  <line x1="890" y1="336" x2="890" y2="410" class="conn-mgmt" marker-end="url(#arrow-green)"/>
  <rect x="840" y="360" width="100" height="16" class="conn-label-bg" rx="3"/>
  <text x="890" y="371" class="conn-label" fill="#1baf7a">Redfish HTTPS</text>

  <!-- ============================================================ -->
  <!-- ZONE: VLAN 520 (existing) — middle -->
  <!-- ============================================================ -->
  <rect x="20" y="270" width="760" height="100" rx="10"
        class="zone-520" stroke-width="2" fill-opacity="0.3"/>
  <text x="40" y="296" class="zone-title" fill="#eda100">VLAN 520 — 10.6.141.0/24</text>
  <text x="40" y="310" class="zone-subtitle">Existing cluster network — lab DHCP serves here</text>

  <rect x="900" y="280" width="80" height="20" rx="10" class="status-ok"/>
  <text x="940" y="294" class="status-text">WORKING</text>

  <!-- Lab DHCP indicator -->
  <rect x="60" y="320" width="140" height="36" rx="6" fill="#fff8e8" stroke="#eda100" stroke-width="1.5"/>
  <text x="130" y="338" class="device-label" fill="#eda100" style="font-weight:600;font-size:10px">⚠ Lab DHCP Server</text>
  <text x="130" y="352" class="device-mac" fill="#eda100">Must NOT serve DPU VLAN</text>

  <!-- Other lab hosts -->
  <rect x="240" y="320" width="140" height="36" rx="6" fill="#ffffff" stroke="#c8c7c1" stroke-width="1"/>
  <text x="310" y="340" class="device-label" style="font-size:10px">Other lab hosts</text>
  <text x="310" y="352" class="device-mac">on VLAN 520</text>

  <!-- Routes label -->
  <rect x="440" y="325" width="170" height="30" rx="6" fill="#ffffff" stroke="#c8c7c1" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="525" y="340" class="device-sublabel" style="font-size:9px">Routed to BMC network</text>
  <text x="525" y="352" class="device-sublabel" style="font-size:9px">10.6.141.x ↔ 10.6.136.x</text>

  <!-- ============================================================ -->
  <!-- ZONE: BMC Management (10.6.136.x) — bottom -->
  <!-- ============================================================ -->
  <rect x="20" y="400" width="980" height="200" rx="10"
        class="zone-bmc" stroke-width="2" fill-opacity="0.3"/>
  <text x="40" y="426" class="zone-title" fill="#1baf7a">BMC Management — 10.6.136.0/24</text>
  <text x="40" y="440" class="zone-subtitle">Out-of-band management — Redfish API</text>

  <rect x="900" y="410" width="80" height="20" rx="10" class="status-ok"/>
  <text x="940" y="424" class="status-text">WORKING</text>

  <!-- DPU BMC box -->
  <rect x="60" y="460" width="240" height="120" class="device"/>
  <rect x="60" y="460" width="240" height="26" rx="6" fill="#1baf7a"/>
  <rect x="60" y="474" width="240" height="12" fill="#1baf7a"/>
  <text x="180" y="478" class="device-header">DPU BMC</text>

  <text x="180" y="504" class="device-label">oob0</text>
  <text x="180" y="517" class="device-mac">a0:88:c2:75:91:8e</text>

  <line x1="80" y1="526" x2="280" y2="526" stroke="#e0dfdb" stroke-width="1"/>

  <text x="180" y="542" class="device-label">BMC Manager</text>
  <text x="180" y="555" class="device-mac">a0:88:c2:75:91:8f</text>

  <text x="180" y="575" class="device-sublabel">IP: 10.6.136.28</text>

  <!-- Host iDRAC box -->
  <rect x="400" y="460" width="240" height="120" class="device"/>
  <rect x="400" y="460" width="240" height="26" rx="6" fill="#1baf7a"/>
  <rect x="400" y="474" width="240" height="12" fill="#1baf7a"/>
  <text x="520" y="478" class="device-header">Host iDRAC (Dell R750)</text>

  <text x="520" y="504" class="device-label">iDRAC NIC</text>
  <text x="520" y="517" class="device-mac">c8:4b:d6:86:f3:a0</text>

  <text x="520" y="545" class="device-sublabel">IP: 10.6.136.44</text>
  <text x="520" y="560" class="device-sublabel">Creds: root / calvin</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2a78d6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#1baf7a"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#e34948"/>
    </marker>
  </defs>

  <!-- ============================================================ -->
  <!-- Legend -->
  <!-- ============================================================ -->
  <rect x="680" y="460" width="300" height="120" rx="8" fill="#fafafa" stroke="#e0dfdb" stroke-width="1"/>
  <text x="700" y="480" class="legend-text" style="font-weight:600;font-size:11px;fill:#1a1a1a">Legend</text>

  <line x1="700" y1="494" x2="730" y2="494" class="conn-data"/>
  <text x="740" y="498" class="legend-text">Data plane (L2, new VLAN)</text>

  <line x1="700" y1="514" x2="730" y2="514" class="conn-mgmt"/>
  <text x="740" y="518" class="legend-text">Management (Redfish, routed)</text>

  <line x1="700" y1="534" x2="730" y2="534" class="conn-bridge"/>
  <text x="740" y="538" class="legend-text" fill="#e34948">Host PXE via DPU bridge</text>

  <rect x="700" y="548" width="30" height="14" rx="4" fill="#e8f2fd" stroke="#2a78d6" stroke-width="1"/>
  <text x="740" y="560" class="legend-text">Dedicated VLAN (requested)</text>

</svg>
</div>
</body>
</html>
