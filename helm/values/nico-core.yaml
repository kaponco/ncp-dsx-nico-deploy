# =============================================================================
# Values override for upstream Core nico chart
# Deployed in the nico-system namespace
# =============================================================================

global:
  image:
    # Built from docker/ubi/Dockerfile.nico-core — quay.io/fdupont-redhat/nico-core
    # never shipped nico-dhcp/nico-hardware-health/nico-pxe/nico-ssh-console-rs
    # binaries. Pinned to an immutable tag, not `latest`: this quay.io namespace
    # already had a stale `latest` cached on cluster nodes from an unrelated
    # build, and IfNotPresent kept serving it after a new push under the same tag.
    repository: quay.io/rh-ee-skapon/nico-core
    tag: dhcp-hooks-20260826b
    pullPolicy: IfNotPresent
  spiffe:
    trustDomain: nico.local
  certificate:
    issuerRef:
      kind: ClusterIssuer
      name: vault-nico-issuer
      group: cert-manager.io

nico-api:
  enabled: true
  replicas: 1
  # Chart default (basic) is rejected outright: "CARBIDE_WEB_AUTH_TYPE=basic
  # is not supported" (crates/api-web/src/lib.rs) — dropped upstream without
  # the chart catching up.
  webAuth:
    mode: none
  # No legacy carbide-api.forge-system clients in this deployment, and we
  # don't otherwise own/create a forge-system namespace for the alias
  # Service to live in (createNamespace defaults to false upstream).
  legacyAlias:
    enabled: false
  bootArtifactContainers: []
  # Uncomment and configure for your architecture:
  # - name: boot-artifacts-x86-64
  #   image: <registry>/boot-artifacts-x86_64:latest
  #   command: ["sh", "-c", "cp -r /x86_64 /boot-artifacts/blobs/internal"]
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  hostname: "nico.local"
  siteConfig:
    enabled: true
    nicoApiSiteConfig: |
      bypass_rbac = true
      initial_domain_name = "nico.local"
      # machine-a-tron doesn't run a real Scout agent, so it can't send
      # measured-boot/TPM attestation reports; without this, hosts stall
      # forever in Measuring/WaitingForMeasurements.
      attestation_enabled = false
      tpm_required = false
      # machine-a-tron's simulated Scout agent calls discover_machine from
      # the pod's real (non-simulated) source IP, which will never match
      # any DHCP-assigned machine_interface address. Without this, host
      # discovery permanently fails with "selected interface and discovery
      # source IP do not belong to the same host" once a host declares a
      # HostInband interface. Test/dev only — see machine_discovery.rs.
      allow_insecure_discovery = true

      [auth]
      permissive_mode = true

      [auth.trust]
      spiffe_trust_domain = "nico.local"
      spiffe_service_base_paths = ["/nico-system/sa/", "/default/sa/", "/elektra-site-agent/sa/"]
      spiffe_machine_base_path = "/nico-system/machine/"

      # Points BMC/Redfish exploration at machine-a-tron's bmc-mock instead
      # of real hardware (see machine-a-tron-testing-guide.md).
      [site_explorer]
      run_interval = "10s"
      allow_zero_dpu_hosts = true
      bmc_proxy = "machine-a-tron-bmc-mock.nico-system.svc.cluster.local:1266"

      # Network segments matching machine-a-tron's simulated DHCP relay
      # addresses, so its discovery requests resolve to a segment instead
      # of being rejected (see machine-a-tron-testing-guide.md).
      [networks.oob]
      type = "underlay"
      prefix = "192.168.2.0/24"
      gateway = "192.168.2.1"
      mtu = 1500
      reserve_first = 10

      [networks.admin]
      type = "admin"
      prefix = "192.168.252.0/24"
      gateway = "192.168.252.1"
      mtu = 9000
      reserve_first = 10

      # v2.2.0-pr's machine-a-tron always declares a HostInband ExpectedInterface
      # for the host-side NIC (crates/machine-a-tron/src/machine_a_tron.rs), so a
      # host_inband segment is now required for the base NoDpu flow, not just
      # tenant allocation. Must match machine-a-tron's host_inband_dhcp_relay_address
      # (see kustomize/machine-a-tron.yaml).
      [networks.hostinband]
      type = "hostinband"
      prefix = "192.168.253.0/24"
      gateway = "192.168.253.1"
      mtu = 9000
      reserve_first = 10

      [pools.lo-ip]
      type = "ipv4"
      ranges = [{ start = "10.100.0.1", end = "10.100.0.254" }]

      [pools.vpc-dpu-lo]
      type = "ipv4"
      ranges = [{ start = "10.101.0.1", end = "10.101.0.254" }]

      [pools.secondary-vtep-ip]
      type = "ipv4"
      ranges = [{ start = "10.102.0.1", end = "10.102.0.254" }]

      [pools.vni]
      type = "integer"
      ranges = [{ start = "100000", end = "199999" }]

      [pools.vpc-vni]
      type = "integer"
      ranges = [{ start = "200000", end = "299999" }]

      [pools.external-vpc-vni]
      type = "integer"
      ranges = [{ start = "300000", end = "399999" }]

      [pools.vlan-id]
      type = "integer"
      ranges = [{ start = "100", end = "4094" }]

      [pools.fnn-asn]
      type = "integer"
      ranges = [{ start = "4200000000", end = "4200000254" }]
  envFrom:
    vaultApproleTokens:
      secretName: nico-vault-approle-tokens
    vaultToken:
      secretName: vault-unseal-secret
    vaultClusterInfo:
      configMapName: vault-cluster-info
    databaseCredentials:
      secretName: nico-site-pg-pguser-nico
    databaseConfig:
      configMapName: nico-system-nico-database-config
    nicoWebHostname:
      configMapName: nico-web-api-hostname
  vaultClusterInfo:
    VAULT_SERVICE: "https://vault.nico-system:8200"
    NICO_VAULT_MOUNT: "secrets"
    NICO_VAULT_PKI_MOUNT: "nicoca"
  databaseConfig:
    DB_HOST: "nico-site-pg-primary"
    DB_PORT: "5432"
    DB_NAME: "nico"

nico-bmc-proxy:
  enabled: true
  envFrom:
    vaultApproleTokens:
      secretName: nico-vault-approle-tokens
    vaultToken:
      secretName: vault-unseal-secret
    vaultClusterInfo:
      configMapName: vault-cluster-info
    databaseCredentials:
      secretName: nico-site-pg-pguser-nico
    databaseConfig:
      configMapName: nico-system-nico-database-config
nico-dhcp:
  enabled: true
  config:
    kea:
      # Chart default is a Debian path; our UBI image installs kea from
      # ISC's repo (RHEL layout) — see docker/ubi/Dockerfile.nico-core.
      hookLibraryPath: "/usr/lib64/kea/hooks/libdhcp.so"
      # Chart ships these as literal "REPLACE_WITH_NICO_*_VIP" placeholders
      # (intentional fail-loud default). Real values are nico-dns/nico-pxe's
      # ClusterIPs (`oc get svc nico-dns nico-pxe -n nico-system`).
      hookParameters:
        nameservers: "172.30.93.58"
        # nico-ntp is disabled; reuses nico-dns's IP — just needs to parse
        # as valid IPv4, nothing here depends on a real NTP server.
        ntpServer: "172.30.93.58"
        provisioningServer: "172.30.214.195"
      # subnet4[].id isn't emitted by this chart at all; auto-numbered
      # post-render instead (helm/plugins/kustomize-post-renderer/render.sh).
      # Kea 3.0.4 requires it; upstream's own Kea 2.2.0 auto-assigns it and
      # has never hit this. Worth a 1-line upstream fix to
      # helm/charts/nico-dhcp/templates/_helpers.tpl's subnet4 loop.
      subnet4:
        - subnet: "0.0.0.0/0"
          pools:
            - "0.0.0.0-255.255.255.255"
nico-dns:
  enabled: true
  replicas: 2
  # Port 53 needs CAP_NET_BIND_SERVICE, but this cluster's runtime doesn't
  # propagate it to the ambient set for non-root exec (CapBnd has it,
  # CapEff doesn't — confirmed via /proc/1/status), so bind() still fails
  # with it granted. Moving off the privileged port avoids needing it.
  listenAddress: "[::]:5353"
  service:
    ports:
      - port: 5353
        name: tcp
        protocol: TCP
      - port: 5353
        name: udp
        protocol: UDP
  # Disabled upstream — binary not ready for production (requires forge-roots
  # volume mount not present in the chart template)
nico-dsx-exchange-consumer:
  enabled: false
nico-hardware-health:
  enabled: true
nico-pxe:
  enabled: true
  # Same as nico-api.legacyAlias above — forge-system namespace we don't own.
  legacyAlias:
    enabled: false
  bootArtifactContainers: []
  # Uncomment and configure for your architecture:
  # - name: boot-artifacts-x86-64
  #   image: <registry>/boot-artifacts-x86_64:latest
  #   command: ["sh", "-c", "cp -r /x86_64 /boot-artifacts/blobs/internal"]
  # - name: boot-artifacts-aarch64
  #   image: <registry>/boot-artifacts-aarch64:latest
  #   command: ["sh", "-c", "cp -r /aarch64 /apt /firmware /boot-artifacts/blobs/internal"]
nico-ssh-console-rs:
  enabled: true
  # Chart hardcodes port 22 in its static config.toml — same ambient-
  # capability issue as nico-dns above. Content below is that file
  # verbatim except for listen_address; defaults already match this
  # deployment's namespace/service names so no substitution is lost.
  service:
    port: 2222
  readinessProbe:
    tcpSocket:
      port: 2222
    initialDelaySeconds: 1
    periodSeconds: 30
    failureThreshold: 3
  configFiles:
    config: |
      listen_address = "[::]:2222"
      metrics_address = "[::]:9009"
      nico_url = "https://nico-api.nico-system.svc.cluster.local:1079"
      carbide_url = "https://nico-api.nico-system.svc.cluster.local:1079"
      nico_root_ca_path = "/var/run/secrets/spiffe.io/ca.crt"
      forge_root_ca_path = "/var/run/secrets/spiffe.io/ca.crt"
      client_cert_path = "/var/run/secrets/spiffe.io/tls.crt"
      client_key_path = "/var/run/secrets/spiffe.io/tls.key"
      host_key = "/etc/ssh/ssh_host_ed25519_key"
      dpus = true
      insecure = false
      openssh_certificate_ca_fingerprints = []
      admin_certificate_role = ""
      insecure_ipmi_ciphers = false
      force_deactivate_conflicting_ipmi_sol_sessions = false
      api_poll_interval = "180s"
      console_logging_enabled = true
      console_logs_path = "/var/log/consoles"
# dockurr/chrony's entrypoint chowns /run/chrony, which fails under
# OpenShift's arbitrary non-root UID. Not in our documented topology or
# required by machine-a-tron testing.
nico-ntp:
  enabled: false
unbound:
  enabled: false

nico-flow:
  enabled: true
  createNamespace: false
  flowEnv: production
  images:
    flow:
      repository: quay.io/fdupont-redhat/nico-flow
      tag: latest
    psm:
      repository: quay.io/fdupont-redhat/nico-psm
      tag: latest
    nsm:
      repository: quay.io/fdupont-redhat/nico-nsm
      tag: latest
  database:
    host: nico-site-pg-primary
    port: 5432
    certPath: ""
    flow:
      name: flow
      credentialsSecret: nico-site-pg-pguser-nico
    psm:
      name: psm
      credentialsSecret: nico-site-pg-pguser-nico
    nsm:
      name: nsm
      credentialsSecret: nico-site-pg-pguser-nico
  nicoCoreApi:
    url: nico-api:1079
  temporal:
    host: temporal-frontend.nico-rest
    port: 7233
    namespace: flow
    enableTls: true
    serverName: interservice.server.temporal.local
    certPath: /var/run/secrets/temporal-client-certs
  temporalCert:
    enabled: true
    issuerRef:
      kind: ClusterIssuer
      name: nico-rest-ca-issuer
      group: cert-manager.io
  vault:
    address: https://vault.nico-system:8200
    psmTokenSecret: psm-vault-token
    nsmTokenSecret: nsm-vault-token
  certificate:
    apiIdentity:
      namespace: nico-system
      serviceName: nico-flow
  imagePullSecret:
    create: false
