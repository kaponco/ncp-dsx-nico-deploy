#
# Remove SYS_PTRACE (SCC-restricted). Real (emptyDir) volumes for
# /var/run/kea and /var/lib/kea — image isn't built for OpenShift's
# arbitrary UID, so the chart's own `mkdir -p` isn't enough.
#
# NET_BIND_SERVICE (for :67) is requested but doesn't actually take
# effect — this cluster's runtime doesn't propagate it to the ambient
# set for non-root exec. Harmless: DHCP is simulated via API here, not
# real UDP (see nico-core.yaml's nico-dhcp comment).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nico-dhcp
spec:
  template:
    spec:
      containers:
        - name: nico-dhcp
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: kea-run
              mountPath: /var/run/kea
            - name: kea-lib
              mountPath: /var/lib/kea
      volumes:
        - name: kea-run
          emptyDir: {}
        - name: kea-lib
          emptyDir: {}
