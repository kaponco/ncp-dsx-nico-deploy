#
# Make nico-roots (Vault CA) volume optional for dev environments.
# Also make the site-config-files ConfigMap volume optional: the chart mounts
# it unconditionally but only creates the ConfigMap when siteConfig.enabled is
# true (kept false in the base so no RBAC-bypass flags ship). Without this the
# nico-api pod hangs in ContainerCreating with FailedMount on a real deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nico-api
spec:
  template:
    spec:
      volumes:
        - name: nico-roots
          secret:
            secretName: nico-roots
            optional: true
        - name: nico-api-site-config-files
          configMap:
            name: nico-api-site-config-files
            optional: true
