#
# The nico-dns chart's service template renders only port/name/protocol, so a
# values override for targetPort is silently dropped and the Service ends up on
# :5353 while nameservers (DHCP option 6) tells clients to query :53. Replace
# the whole ports list with :53 -> targetPort 5353 (nico-dns's real listener).
# JSON patch (not strategic merge) so 5353 is replaced, not appended.
- op: replace
  path: /spec/ports
  value:
    - port: 53
      targetPort: 5353
      name: tcp
      protocol: TCP
    - port: 53
      targetPort: 5353
      name: udp
      protocol: UDP
