#
# Chart assumes --nico-url; the real flag is --api-uri (see
# crates/dns/src/main.rs) — nico-dns fails to start otherwise.
#
# Port 5353 matches nico-core.yaml's nico-dns.listenAddress override;
# this patch replaces the whole command array so it must match by hand.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nico-dns
spec:
  template:
    spec:
      containers:
        - name: nico-dns
          command:
            - /bin/sh
            - -c
            - |
              if [ -x /opt/nico/nico-dns ]; then
                exec /opt/nico/nico-dns run --api-uri="${NICO_API}" --listen="[::]:5353"
              else
                exec /opt/carbide/carbide-dns run --carbide-url="${NICO_API}" --listen="[::]:5353"
              fi
