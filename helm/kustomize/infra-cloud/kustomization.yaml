apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - all.yaml

patches:
  # Remove conflicting grpc readinessProbe handler on temporal-frontend
  - path: patches/fix-temporal-frontend-readinessprobe.yaml
    target:
      kind: Deployment
      name: temporal-frontend
  # Clear fixed UID securityContext on temporal server deployments for OpenShift SCC
  - path: patches/fix-temporal-server-securitycontext.yaml
    target:
      kind: Deployment
      name: temporal-frontend
  - path: patches/fix-temporal-server-securitycontext.yaml
    target:
      kind: Deployment
      name: temporal-history
  - path: patches/fix-temporal-server-securitycontext.yaml
    target:
      kind: Deployment
      name: temporal-matching
  - path: patches/fix-temporal-server-securitycontext.yaml
    target:
      kind: Deployment
      name: temporal-worker
